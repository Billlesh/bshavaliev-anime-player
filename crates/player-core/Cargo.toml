[package]
name = "player-core"
version = "0.1.0"
edition = "2021"
description = "Cache, pipeline params, GPU queue, and portable paths for Anime Player"
license = "MIT"
publish = false

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
thiserror = "2.0.11"
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.14.0"
