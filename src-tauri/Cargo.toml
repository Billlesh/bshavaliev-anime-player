[package]
name = "anime-player"
version = "0.1.0"
description = "Windows anime player: play original, preprocess to QHD 60 FPS, switch to cache"
authors = ["bshavaliev"]
edition = "2021"
publish = false

[lib]
name = "anime_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
player-core = { path = "../crates/player-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "=1.43.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.11.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Named-pipe IPC to portable mpv.exe (libmpv JSON protocol).
# tokio windows named pipe is in tokio::net::windows.

[features]
default = []
