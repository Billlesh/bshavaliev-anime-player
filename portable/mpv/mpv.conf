# Anime Player — Windows / NVIDIA (RTX 4070) defaults.
# config-dir is portable/mpv. Shaders toggle at runtime from the Tauri shell.

vo=gpu-next
gpu-api=d3d11
hwdec=nvdec
hwdec-codecs=all
profile=gpu-hq
dither-depth=auto
deband=no
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

keep-open=yes
force-window=yes
idle=yes
osc=yes
osd-bar=yes
cursor-autohide=1000
title=Anime Player
force-media-title=Anime Player

sub-auto=fuzzy
sub-ass-override=no
audio-file-auto=fuzzy
alang=jpn,ja,jp,und
slang=en,eng,enm

# Line enhance after a light deband. The UI can clear this list.
glsl-shaders="~~/shaders/deband.glsl;~~/shaders/line_enhance.glsl"
